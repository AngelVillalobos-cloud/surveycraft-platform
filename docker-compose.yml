version: '3.8'
services:
  oracle:
    image: gvenzl/oracle-xe:21.3.0
    container_name: surveycraft-oracle
    environment:
      - ORACLE_PASSWORD=Oracle123
    ports:
      - "1521:1521"
    healthcheck:
      test: [ "CMD", "ls", "/opt/oracle/oradata" ]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - oracle_data:/opt/oracle/oradata

  backend:
    build: .
    container_name: surveycraft-backend
    restart: on-failure
    ports:
      - "8080:8080"
    depends_on:
      oracle:
        condition: service_healthy
    environment:
      - SPRING_DATASOURCE_URL=jdbc:oracle:thin:@oracle:1521/XEPDB1
      - SPRING_DATASOURCE_USERNAME=SYSTEM
      - SPRING_DATASOURCE_PASSWORD=Oracle123
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update

  frontend:
    build: ./frontend
    container_name: surveycraft-frontend
    restart: on-failure
    ports:
      - "5173:5173"
    environment:
      - VITE_API_TARGET=http://backend:8080
    depends_on:
      - backend

volumes:
  oracle_data:
