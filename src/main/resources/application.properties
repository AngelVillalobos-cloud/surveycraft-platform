# ===============================
# DATABASE CONFIGURATION (ORACLE)
# ===============================
# OJO: Cambia 'localhost:1521/xe' por tu conexión real.
# 'xe' es común si usas Oracle Express Edition. Si usas otra, puede ser 'orcl'.
spring.datasource.url=jdbc:oracle:thin:@localhost:1521:xe
spring.datasource.username=SYSTEM
spring.datasource.password=tu_password_real_de_oracle
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# ===============================
# JPA / HIBERNATE CONFIGURATION
# ===============================
# 'update' intenta crear las tablas si no existen. 
# Como tienes un script SQL manual, a veces es mejor poner 'none' o 'validate' 
# para evitar conflictos, pero 'update' está bien para empezar.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Dialecto IMPORTANTE para que Java entienda Oracle
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.OracleDialect
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# THYMELEAF CONFIGURATION
# ===============================
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML5
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.cache=false

# ===============================
# SERVER CONFIGURATION
# ===============================
server.port=8080
spring.application.name=SurveyCraft1.1

# ===============================
# LOGGING CONFIGURATION
# ===============================
logging.level.com.surveycraft=DEBUG
logging.level.org.hibernate.SQL=DEBUG